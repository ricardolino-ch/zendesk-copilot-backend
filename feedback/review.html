<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Ricardo Copilot · Korrekturen</title>
<style>
body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;max-width:1100px;margin:35px auto;padding:0 20px}button,input,textarea{font:inherit;padding:9px;border:1px solid #c1c7d0;border-radius:5px}button{cursor:pointer;background:#0052cc;color:#fff;margin:0 8px 8px 0}.danger{background:#fff;color:#bf2600;border-color:#bf2600}.tabs{margin:18px 0}.tab.active{background:#172b4d}.item{border:1px solid #dfe1e6;border-radius:8px;margin:18px 0;padding:18px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;white-space:pre-wrap;background:#f7f9fc;padding:12px}.muted{color:#5e6c84}.edit{width:100%;min-height:120px;box-sizing:border-box}
</style></head>
<body><h1>Ricardo Copilot · Korrekturen verwalten</h1><p class="muted">Freigeben übernimmt eine Korrektur in die Lernbasis. Genehmigte Korrekturen können später bearbeitet oder entfernt werden.</p>
<p><input id="token" type="password" placeholder="Review-Token"><button id="load">Aktualisieren</button></p><div id="status"></div>
<div class="tabs"><button class="tab active" id="pending-tab">Offene Korrekturen</button><button class="tab" id="approved-tab">Genehmigte Korrekturen</button></div>
<section id="pending"><h2>Offene Korrekturen</h2><div id="pending-list"></div></section>
<section id="approved" hidden><h2>Genehmigte Korrekturen</h2><div id="approved-list"></div></section>
<script>
const token=()=>document.getElementById('token').value;const headers=()=>({'Authorization':'Bearer '+token(),'Content-Type':'application/json'});const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(path){const r=await fetch(path,{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.error||'Laden fehlgeschlagen');return d.items||[]}
function pendingCard(i){return `<article class="item"><div class="muted">${esc(i.createdAt||'')} · Sprache: ${esc(i.language||'')}</div><div class="cols"><div><b>Original</b><br>${esc(i.original)}</div><div><b>Korrigiert</b><br>${esc(i.corrected)}</div></div><p><button onclick="review(${i.index},'approved')">Korrektur genehmigen</button><button class="danger" onclick="review(${i.index},'rejected')">Ablehnen</button></p></article>`}
function approvedCard(i){return `<article class="item"><div class="muted">${esc(i.reviewedAt||i.createdAt||'')} · Sprache: ${esc(i.language||'')}</div><p><b>Original</b></p><div class="cols"><div>${esc(i.original)}</div><div><textarea class="edit" id="edit-${i.index}">${esc(i.corrected)}</textarea></div></div><p><button onclick="saveEdit(${i.index})">Änderung speichern</button><button class="danger" onclick="removeApproved(${i.index})">Korrektur entfernen</button></p></article>`}
async function load(){try{const [p,a]=await Promise.all([get('/feedback/pending'),get('/feedback/approved')]);document.getElementById('pending-list').innerHTML=p.map(pendingCard).join('')||'<p>Keine offenen Korrekturen.</p>';document.getElementById('approved-list').innerHTML=a.map(approvedCard).join('')||'<p>Keine genehmigten Korrekturen.</p>'}catch(e){document.getElementById('status').textContent=e.message}}
async function review(index,status){await fetch('/feedback/review',{method:'POST',headers:headers(),body:JSON.stringify({index,status})});load()}
async function saveEdit(index){const corrected=document.getElementById('edit-'+index).value;await fetch('/feedback/review/'+index,{method:'PATCH',headers:headers(),body:JSON.stringify({corrected})});load()}
async function removeApproved(index){if(!confirm('Diese genehmigte Korrektur wirklich entfernen?'))return;await fetch('/feedback/review/'+index,{method:'DELETE',headers:headers()});load()}
document.getElementById('load').onclick=load;document.getElementById('pending-tab').onclick=()=>{pending.hidden=false;approved.hidden=true;document.getElementById('pending-tab').classList.add('active');document.getElementById('approved-tab').classList.remove('active')};document.getElementById('approved-tab').onclick=()=>{pending.hidden=true;approved.hidden=false;document.getElementById('approved-tab').classList.remove('active');document.getElementById('approved-tab').classList.add('active')};
</script></body></html>
