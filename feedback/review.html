<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Ricardo Copilot · Korrekturen prüfen</title><style>body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;max-width:1100px;margin:35px auto;padding:0 20px}button,input{font:inherit;padding:9px;border:1px solid #c1c7d0;border-radius:5px}button{cursor:pointer;background:#0052cc;color:#fff;margin-right:8px}.reject{background:#fff;color:#bf2600;border-color:#bf2600}.item{border:1px solid #dfe1e6;border-radius:8px;margin:18px 0;padding:18px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;white-space:pre-wrap;background:#f7f9fc;padding:12px}.muted{color:#5e6c84}</style></head><body><h1>Ricardo Copilot · Korrekturen prüfen</h1><p class="muted">Freigeben bedeutet, dass das Beispiel künftig als geprüftes Muster verwendet werden darf.</p><p><input id="token" type="password" placeholder="Review-Token"><button id="load">Offene Korrekturen laden</button></p><div id="status"></div><div id="list"></div><script>const token=()=>document.getElementById('token').value;const headers=()=>({'Authorization':'Bearer '+token(),'Content-Type':'application/json'});async function load(){const r=await fetch('/feedback/pending',{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.error||'Laden fehlgeschlagen');document.getElementById('list').innerHTML=d.items.map(i=>`<article class="item"><div class="muted">${i.createdAt} · Sprache: ${i.language}</div><div class="cols"><div><b>Original</b><br>${esc(i.original)}</div><div><b>Korrigiert</b><br>${esc(i.corrected)}</div></div><p><button onclick="review(${i.index},'approved')">Freigeben</button><button class="reject" onclick="review(${i.index},'rejected')">Ablehnen</button></p></article>`).join('')||'<p>Keine offenen Korrekturen.</p>'}async function review(index,status){await fetch('/feedback/review',{method:'POST',headers:headers(),body:JSON.stringify({index,status})});load()}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('load').onclick=()=>load().catch(e=>document.getElementById('status').textContent=e.message)</script></body></html>
